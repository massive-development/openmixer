[package]
name = "om-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# The workspace forbids unsafe code. This crate denies it and allows it only in `abi.rs` and
# `loader.rs` (the C-ABI loader) and `clap/entry.rs` (the CLAP loader, feature `clap`); see `src/lib.rs`.
[lints.rust]
unsafe_code = "deny"

[features]
# CLAP hosting through clack (ADR 0007). Off by default; this crate's own tests turn it on through the
# self dev-dependency below, so `cargo test` and `cargo clippy --all-targets` cover it.
clap = ["dep:clack-host", "dep:clack-extensions", "dep:raw-window-handle", "dep:rustix", "dep:tracing"]

[dependencies]
om-core.workspace = true
om-engine.workspace = true
om-midi.workspace = true
libloading = "0.8"
serde_json.workspace = true
thiserror.workspace = true
rtrb.workspace = true
clack-host = { workspace = true, optional = true }
clack-extensions = { workspace = true, optional = true, features = [
    "clack-host", "audio-ports", "params", "state", "latency", "tail", "gui", "timer", "posix-fd",
    "thread-check", "log", "raw-window-handle_06",
] }
raw-window-handle = { version = "0.6", optional = true }
rustix = { version = "1", default-features = false, features = ["std", "event"], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
assert_no_alloc = "1.1"
tempfile.workspace = true

# Only Linux builds the CLAP host in the first release (X11 and Wayland); other platforms follow.
[target.'cfg(target_os = "linux")'.dev-dependencies]
om-plugins = { path = ".", features = ["clap"] }
