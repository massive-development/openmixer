[package]
name = "om-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
cpal = "0.18"
om-core.workspace = true
om-engine.workspace = true
rtrb.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Real-time priority for cpal's callback thread: cpal promotes it itself and reports a refusal on
# the error callback (logged and counted by `cpal_device`); the stream then plays at normal
# priority. On Windows the plain `realtime` feature is enough and needs no system library.
[target.'cfg(windows)'.dependencies]
cpal = { version = "0.18", features = ["realtime"] }

[features]
# Linux: promote through rtkit over D-Bus. Off by default in this crate because it builds libdbus
# (needs `libdbus-1-dev`); without it cpal's Linux promotion is a no-op. The `openmixer` binary turns it
# on by default through its own `realtime-dbus` feature.
realtime-dbus = ["cpal/realtime-dbus"]

[dev-dependencies]
om-core.workspace = true
om-testing.workspace = true
