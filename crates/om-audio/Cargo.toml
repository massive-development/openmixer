[package]
name = "om-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# `realtime-dbus`: cpal promotes its own callback thread (audio_thread_priority, rtkit on Linux) and
# reports a refusal on the error callback, after which the stream plays at normal priority.
cpal = { version = "0.18", features = ["realtime-dbus"] }
om-core.workspace = true
om-engine.workspace = true
rtrb.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
om-core.workspace = true
om-testing.workspace = true
