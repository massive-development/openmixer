[package]
name = "om-ui-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "GPUI window layer for OpenMixer: drawing and event glue over om-ui's models."

[lints]
workspace = true

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui-kit = { version = "=0.8.1", default-features = false, features = ["component", "assets"] }
om-analysis.workspace = true
om-core.workspace = true
om-engine.workspace = true
om-library.workspace = true
om-ui.workspace = true
om-midi.workspace = true
# OS media keys and now-playing (#229). `use_zbus` keeps libdbus (a system library) out of the build.
souvlaki = { version = "=0.9.3", default-features = false, features = ["use_zbus"] }

[target.'cfg(windows)'.dependencies]
# The Win32 window handle souvlaki attaches to (a type-only crate GPUI already uses).
raw-window-handle = "0.6"

[dev-dependencies]
om-testing.workspace = true
tempfile.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }
