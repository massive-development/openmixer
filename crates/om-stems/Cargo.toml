[package]
name = "om-stems"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
om-analysis = { path = "../om-analysis" }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# Plain HTTP only: ureq 2 with TLS pulls webpki-roots (CDLA-Permissive-2.0, not allowed in deny.toml).
ureq = { version = "2", default-features = false }

[dev-dependencies]
tempfile = "3"
