[package]
name = "om-stems"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
om-analysis.workspace = true
om-engine.workspace = true
realfft = "3.5"
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# HTTPS through rustls (the `tls` feature). The root bundle is webpki-roots, licensed
# CDLA-Permissive-2.0, which deny.toml allows (see the comment there).
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile.workspace = true

[features]
onnx = []
