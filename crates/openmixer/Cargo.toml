[package]
name = "openmixer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
om-core = { path = "../om-core" }
om-engine = { path = "../om-engine" }
om-audio = { path = "../om-audio" }
# The GPUI window (not a workspace member; see the root Cargo.toml). Off by default.
om-ui-gpui = { path = "../om-ui-gpui", optional = true }

[features]
default = []
gui = ["dep:om-ui-gpui"]

[lints]
workspace = true
