[package]
name = "openmixer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
om-core.workspace = true
om-engine.workspace = true
om-audio.workspace = true
om-midi.workspace = true
om-plugins.workspace = true
om-library.workspace = true
om-analysis.workspace = true
om-stems.workspace = true
om-automix.workspace = true
thiserror.workspace = true
om-ui.workspace = true
dirs.workspace = true
serde_json.workspace = true
base64 = "0.22"
# The example plugin, compiled in as a built-in the Plugins page can load and unload.
gain-plugin = { path = "../../examples/plugins/gain-plugin" }
# The GPUI window. On by default; `--no-default-features` builds the headless binary.
om-ui-gpui = { workspace = true, optional = true }

[features]
default = ["gui", "realtime-dbus"]
# Real stem separation through ONNX Runtime (see om-stems). Off by default: no runtime, no network.
onnx = ["om-stems/onnx"]
# Decode fallback that runs the `ffmpeg` executable for formats symphonia lacks (see om-engine). Off by default.
ffmpeg = ["om-engine/ffmpeg"]
# CLAP plugin hosting (ADR 0007): the Plugins page can open a CLAP plugin's own window. Off by default.
clap = ["om-plugins/clap"]
# Real-time priority for the audio callback on Linux (cpal asks rtkit over D-Bus). On by default;
# builds libdbus, so Linux needs `libdbus-1-dev`. `--no-default-features` builds without it.
realtime-dbus = ["om-audio/realtime-dbus"]
# The window. Off (`--no-default-features`) leaves only the headless flags: --smoke and --version.
gui = ["dep:om-ui-gpui"]

[lints]
workspace = true

[dev-dependencies]
om-testing.workspace = true
tempfile.workspace = true
