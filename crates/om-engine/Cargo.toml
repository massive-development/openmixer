[package]
name = "om-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
om-core.workspace = true
om-dsp.workspace = true
om-stretch.workspace = true
# The 0.35 line cpal links, so the build carries one copy. Default features keep the D-Bus (rtkit)
# path: without it the crate is a no-op on Linux.
audio_thread_priority = "0.35"
rtrb.workspace = true
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac"] }
thiserror.workspace = true
tracing.workspace = true

[features]
# Optional decode fallback: runs the `ffmpeg` executable (not linked) for formats symphonia lacks.
ffmpeg = []

[dev-dependencies]
assert_no_alloc = "1.1"
om-testing.workspace = true
tempfile.workspace = true
