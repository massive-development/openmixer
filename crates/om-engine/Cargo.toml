[package]
name = "om-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
om-core.workspace = true
om-dsp.workspace = true
om-stretch.workspace = true
rtrb.workspace = true
audioadapter-buffers.workspace = true
rubato.workspace = true
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac"] }
bytemuck = { version = "1", features = ["extern_crate_alloc"], optional = true }
thiserror.workspace = true
tracing.workspace = true

[features]
# Optional decode fallback: runs the `ffmpeg` executable (not linked) for formats symphonia lacks.
ffmpeg = ["dep:bytemuck"]

[dev-dependencies]
assert_no_alloc = "1.1"
divan = "0.1.21"
om-testing.workspace = true
tempfile.workspace = true

[[bench]]
name = "hot_loops"
harness = false
