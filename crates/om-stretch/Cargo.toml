[package]
name = "om-stretch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Deliberately not `[lints] workspace = true`: the workspace forbids unsafe code, and this crate is
# the one place that may use it. `unsafe` is denied crate-wide and allowed only in `src/ffi.rs`,
# which wraps Rubber Band's C API (see that module's docs for why).
[lints.rust]
unsafe_code = "deny"

[dependencies]
rubberband-sys = "0.1.4"
thiserror.workspace = true
