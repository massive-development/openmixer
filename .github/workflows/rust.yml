# OpenMixer Rust CI: fmt, clippy, test on all platforms; licence/ban policy on Linux.
name: Rust

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# TODO (not added, Todo 29): a Linux job for `cargo check -p openmixer --features gui` (the window). The
# link line on this box needs freetype, xcb, xkbcommon and xkbcommon-x11 development packages; wayland and
# fontconfig are not verified on a clean runner, and the GPUI tree is large enough to need a cache. Until
# that is checked on a runner, see docs/spikes/DECISIONS.md "GPUI integration".

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain from rust-toolchain.toml
        id: tc
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
          components: rustfmt, clippy

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libclang-dev: bindgen (rubberband-sys, via om-stretch) needs libclang at build time.
          sudo apt-get install -y libasound2-dev pkg-config libclang-dev

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  deny:
    name: cargo deny (licences and bans)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check
