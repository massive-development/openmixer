# OpenMixer Rust CI: fmt, clippy, test on all platforms; licence/ban policy on Linux.
name: Rust

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Linux only for now; macOS and Windows return in the porting phase (see docs/spikes/DECISIONS.md "CI status by platform").
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain from rust-toolchain.toml
        id: tc
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
          components: rustfmt, clippy

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libclang-dev: bindgen (rubberband-sys, via om-stretch) needs libclang at build time.
          # The rest is the GPUI window (om-ui-gpui is a workspace member and a default feature).
          sudo apt-get install -y libasound2-dev pkg-config libclang-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libfreetype-dev libfontconfig1-dev libwayland-dev \
            libvulkan-dev libssl-dev

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo test (headless binary)
        run: cargo test -p openmixer --no-default-features

      # The fake-ffmpeg tests need no ffmpeg binary.
      - name: cargo test (ffmpeg decode fallback)
        run: cargo test -p om-engine --features ffmpeg

  deny:
    name: cargo deny (licences and bans)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check

  # The `onnx` feature of om-stems pulls ONNX Runtime (ort `download-binaries`: the build downloads a
  # prebuilt runtime, so it needs network). Off in the default build and in the jobs above. Blocking
  # since the real htdemucs graph was checked against the contract (`htdemucs_reference.rs`; its model
  # test is `#[ignore]`d because the 174 MB graph is not in the repository).
  onnx:
    name: onnx (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain from rust-toolchain.toml
        id: tc
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.tc.outputs.channel }}

      - name: Install Linux audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libclang-dev

      - uses: Swatinem/rust-cache@v2

      # ort-sys downloads a prebuilt ONNX Runtime from cdn.pyke.io at build time. Cache it, so most runs
      # never touch the CDN.
      - name: Cache the ONNX Runtime download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # The CDN has served a file whose hash did not match once (run 40648072742). That is a bad
      # download, not a test failure: retry it, and only it. Any other failure fails the job at once.
      - name: cargo test -p om-stems --features onnx
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo test -p om-stems --features onnx 2>&1 | tee "$RUNNER_TEMP/onnx.log"; then
              exit 0
            fi
            if ! grep -q 'does not match the expected hash' "$RUNNER_TEMP/onnx.log"; then
              exit 1
            fi
            echo "ONNX Runtime download failed its hash check (attempt $attempt); retrying"
            rm -rf ~/.cache/ort.pyke.io
            sleep 20
          done
          exit 1

  # The progress heatmap must match docs/progress.json (stdlib only).
  progress-check:
    name: progress heatmap is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check heatmap is current
        run: python3 tools/progress_heatmap.py --check

  # The ASIO SDK must never be committed (ADR 0001). Searches every tracked
  # file except the docs, the workflows, the markdown policy docs and NOTICE, which name the rule.
  # File names are checked too, so a committed SDK header or driver directory fails even with no text match.
  legal-guards:
    name: legal guards (no ASIO SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: No ASIO SDK in the tree
        run: |
          if git grep -l -e 'asiodrv' -e 'ASIO SDK' -- . ':!docs' ':!.github' ':!*.md' ':!NOTICE'; then
            echo "ERROR: ASIO SDK reference found in a tracked file"
            exit 1
          fi

      - name: No ASIO SDK file names in the tree
        run: |
          if git ls-files | grep -i -E '(^|/)(iasiodrv|asio(sdk|drivers))'; then
            echo "ERROR: ASIO SDK file name found in the tracked tree"
            exit 1
          fi

  # Weekly (and on demand) 10-minute soaks. Ignored by default, so they never run in the PR gate.
  soak:
    name: soak (10-minute, ignored tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain from rust-toolchain.toml
        id: tc
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
          components: rustfmt, clippy

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libclang-dev: bindgen (rubberband-sys, via om-stretch) needs libclang at build time.
          # The rest is the GPUI window (om-ui-gpui is a workspace member and a default feature).
          sudo apt-get install -y libasound2-dev pkg-config libclang-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libfreetype-dev libfontconfig1-dev libwayland-dev \
            libvulkan-dev libssl-dev

      - uses: Swatinem/rust-cache@v2

      - name: soak (om-audio, 10 minutes)
        run: cargo test -p om-audio --test soak -- --ignored --nocapture

      - name: ui gate (openmixer, 10 minutes)
        run: cargo test -p openmixer --test ui_gate -- --ignored
