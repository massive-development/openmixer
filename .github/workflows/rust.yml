# OpenMixer Rust CI: fmt, clippy, test on all platforms; licence/ban policy on Linux.
name: Rust

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Linux-first (docs/spikes/DECISIONS.md, "CI status by platform"): only the Linux leg is required.
    # macOS and Windows run for signal only until Windows and macOS support lands; remove this when they are green.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain from rust-toolchain.toml
        id: tc
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
          components: rustfmt, clippy

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libclang-dev: bindgen (rubberband-sys, via om-stretch) needs libclang at build time.
          sudo apt-get install -y libasound2-dev pkg-config libclang-dev

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  deny:
    name: cargo deny (licences and bans)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check

  # Non-blocking: the `onnx` feature of om-stems pulls ONNX Runtime (ort `download-binaries`: the build
  # downloads a prebuilt runtime, so it needs network). Off in the default build and in the jobs above.
  # Remove `continue-on-error` once the first runs are green on a clean runner.
  onnx:
    name: onnx (linux, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain from rust-toolchain.toml
        id: tc
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.tc.outputs.channel }}

      - name: Install Linux audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libclang-dev

      - uses: Swatinem/rust-cache@v2

      - name: cargo test -p om-stems --features onnx
        run: cargo test -p om-stems --features onnx

  # The progress heatmap must match docs/progress.json (stdlib only).
  progress-check:
    name: progress heatmap is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check heatmap is current
        run: python3 tools/progress_heatmap.py --check

  # The ASIO SDK must never be committed (ADR 0001). Searches every tracked
  # file except the docs, the workflows, the markdown policy docs and NOTICE, which name the rule.
  # File names are checked too, so a committed SDK header or driver directory fails even with no text match.
  legal-guards:
    name: legal guards (no ASIO SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: No ASIO SDK in the tree
        run: |
          if git grep -l -e 'asiodrv' -e 'ASIO SDK' -- . ':!docs' ':!.github' ':!*.md' ':!NOTICE'; then
            echo "ERROR: ASIO SDK reference found in a tracked file"
            exit 1
          fi

      - name: No ASIO SDK file names in the tree
        run: |
          if git ls-files | grep -i -E '(^|/)(iasiodrv|asio(sdk|drivers))'; then
            echo "ERROR: ASIO SDK file name found in the tracked tree"
            exit 1
          fi

  # Non-blocking: the first runs reveal which system packages the GPUI window needs on a clean runner.
  # GPUI is not a workspace member (see docs/spikes/DECISIONS.md, "GPUI integration"), so its tests run
  # from its own directory. Remove `continue-on-error` once the package list is verified.
  gui-check:
    name: gui check (linux, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain from rust-toolchain.toml
        id: tc
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
          components: rustfmt, clippy

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libfreetype-dev libfontconfig1-dev libwayland-dev libvulkan-dev libssl-dev \
            libclang-dev

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (openmixer with the gui feature)
        run: cargo check -p openmixer --features gui

      - name: cargo test (om-ui-gpui, all targets)
        working-directory: crates/om-ui-gpui
        run: cargo test

  # Non-blocking: fmt, clippy and licence/ban/advisory policy for om-ui-gpui (outside the workspace).
  # Own job so lint results are not hidden behind the GPUI build or test failures in gui-check.
  # Becomes required once it is green twice in a row; then drop `continue-on-error`.
  gpui-lint:
    name: gpui lint (linux, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain from rust-toolchain.toml
        id: tc
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
          components: rustfmt, clippy

      - name: Install GPUI system dependencies
        # Same package list as gui-check: clippy compiles the GPUI tree.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libfreetype-dev libfontconfig1-dev libwayland-dev libvulkan-dev libssl-dev \
            libclang-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/om-ui-gpui

      - name: cargo fmt (om-ui-gpui)
        run: cargo fmt --manifest-path crates/om-ui-gpui/Cargo.toml --check

      - name: cargo clippy (om-ui-gpui)
        run: cargo clippy --manifest-path crates/om-ui-gpui/Cargo.toml --all-targets -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # The GPUI policy is crates/om-ui-gpui/deny.toml (the root policy plus what the GPUI tree needs).
      - name: cargo deny (om-ui-gpui licences, bans, advisories, sources)
        run: cargo deny --manifest-path crates/om-ui-gpui/Cargo.toml --config crates/om-ui-gpui/deny.toml check
