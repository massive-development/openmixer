# OpenMixer Rust CI: fmt, clippy, test on all platforms; licence/ban policy on Linux.
name: Rust

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain from rust-toolchain.toml
        id: tc
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
          components: rustfmt, clippy

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libclang-dev: bindgen (rubberband-sys, via om-stretch) needs libclang at build time.
          sudo apt-get install -y libasound2-dev pkg-config libclang-dev

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  deny:
    name: cargo deny (licences and bans)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check

  # Ported from the C++ ci.yml: the progress heatmap must match docs/progress.json (stdlib only).
  progress-check:
    name: progress heatmap is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check heatmap is current
        run: python3 tools/progress_heatmap.py --check

  # Ported from the C++ ci.yml: the ASIO SDK must never be committed (ADR 0001). Searches every tracked
  # file except the docs and the workflows, which name the rule.
  legal-guards:
    name: legal guards (no ASIO SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: No ASIO SDK in the tree
        run: |
          if git grep -l -e 'asiodrv' -e 'ASIO SDK' -- . ':!docs' ':!.github'; then
            echo "ERROR: ASIO SDK reference found in a tracked file"
            exit 1
          fi

  # Non-blocking: the first runs reveal which system packages the GPUI window needs on a clean runner.
  # GPUI is not a workspace member (see docs/spikes/DECISIONS.md, "GPUI integration"), so its tests run
  # from its own directory. Remove `continue-on-error` once the package list is verified.
  gui-check:
    name: gui check (linux, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain from rust-toolchain.toml
        id: tc
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.tc.outputs.channel }}

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libfreetype-dev libfontconfig1-dev libwayland-dev libvulkan-dev libssl-dev \
            libclang-dev

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (openmixer with the gui feature)
        run: cargo check -p openmixer --features gui

      - name: cargo test (om-ui-gpui glue)
        working-directory: crates/om-ui-gpui
        run: cargo test --lib
