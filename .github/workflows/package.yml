# OpenMixer installers: `tools/package.sh` on Linux, Windows and macOS, the packages uploaded as
# workflow artifacts. Runs on demand, on a version tag, and on a pull request that changes the
# packaging. Signing (docs/features/tauri-trial.md, "Signing") runs only where its secrets or
# variables are set, so a fork or a pull request builds unsigned packages:
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE                  signed checksums, signed AppImage
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_API_ISSUER,
#   APPLE_API_KEY, APPLE_API_KEY_P8                  Developer ID signing and notarisation
#   SIGNPATH_API_TOKEN; vars SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
#   SIGNPATH_SIGNING_POLICY_SLUG                     Windows installers signed by SignPath
# Outside pull requests every package also gets a GitHub build provenance attestation. On a `v*`
# tag, the `release` job puts every OS's packages into a draft GitHub release, for a person to
# check and publish.
name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - tools/package.sh
      - tools/package/**
      - crates/om-ui-tauri/tauri.conf.json
      - crates/om-ui-tauri/tauri.bundle.json
      - crates/om-ui-tauri/icons/**
      - .github/workflows/package.yml

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      # Build provenance attestations, and SignPath reading the unsigned artifact.
      id-token: write
      attestations: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: the oldest glibc GitHub offers, so the Linux packages run on more systems.
        # macos-latest builds for Apple silicon.
        os: [ubuntu-22.04, windows-2022, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Read toolchain from rust-toolchain.toml
        id: tc
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.tc.outputs.channel }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The binary (ALSA, D-Bus, bindgen for rubberband), the Tauri window (WebKitGTK), and the
          # bundler (rpm for the .rpm, file and xdg-utils for the AppImage).
          sudo apt-get install -y libasound2-dev pkg-config libclang-dev libdbus-1-dev libssl-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev file xdg-utils rpm

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/om-ui-tauri/web/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          key: package

      - name: Import the GPG signing key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "no GPG_PRIVATE_KEY: checksums stay unsigned"; exit 0; }
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          echo "OPENMIXER_GPG_KEY=$fpr" >> "$GITHUB_ENV"
          echo "OPENMIXER_GPG_PASSPHRASE=$GPG_PASSPHRASE" >> "$GITHUB_ENV"

      # Tauri signs and notarises when these are set; an empty one would make it try and fail, so
      # only the set ones are exported. Without them the .app is signed ad hoc.
      - name: Apple signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER APPLE_API_KEY; do
            [ -n "${!name}" ] && echo "$name=${!name}" >> "$GITHUB_ENV"
          done
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
          fi
          [ -n "$APPLE_CERTIFICATE" ] || echo "no APPLE_CERTIFICATE: the .app is signed ad hoc"

      - name: Build the packages
        shell: bash
        run: tools/package.sh

      # SignPath signs the uploaded installers and hands them back; then the checksums are redone.
      # Not on pull requests: the token is a secret and every request waits for an approval.
      - name: Upload the unsigned Windows installers
        id: unsigned
        if: >-
          runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != '' &&
          github.event_name != 'pull_request' && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: openmixer-Windows-unsigned
          path: |
            target/packages/windows/*.msi
            target/packages/windows/*.exe
          if-no-files-found: error

      - name: Sign the Windows installers (SignPath)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-installers
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: target/signed-windows

      - name: Use the signed Windows installers
        if: steps.unsigned.outcome == 'success'
        shell: bash
        run: |
          cp target/signed-windows/* target/packages/windows/
          tools/package/checksums.sh target/packages/windows

      - name: Attest build provenance
        if: github.event_name != 'pull_request' && !env.ACT
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/packages/*/*

      # Skipped under `act` (it sets ACT): its artifact server is unreachable from Docker Desktop on WSL.
      - name: Upload the packages
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: openmixer-${{ runner.os }}
          path: target/packages/
          if-no-files-found: error

  # A draft, never published here: the installers are tried on real machines first. The notes are
  # docs/releases/<tag>.md, followed by GitHub's generated list of merged pull requests.
  release:
    name: draft release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          pattern: openmixer-*
          path: dist

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The signed installers only: the unsigned Windows upload is SignPath's input.
          mapfile -t files < <(find dist/openmixer-Linux dist/openmixer-Windows dist/openmixer-macOS \
            -type f 2>/dev/null | sort)
          [ ${#files[@]} -gt 0 ] || { echo "no packages downloaded"; exit 1; }
          notes="docs/releases/$TAG.md"
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            exit 0
          fi
          pre=(); [[ "$TAG" == *-* ]] && pre=(--prerelease)
          gh release create "$TAG" "${files[@]}" --draft "${pre[@]}" --verify-tag \
            --title "OpenMixer ${TAG#v}" --notes-file "$notes" --generate-notes
