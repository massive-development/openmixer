# Fast gate: feature PRs into `stage` build once on Linux and run tests
name: PR Tests

on:
  pull_request:
    branches: [stage]
  workflow_dispatch:

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CMAKE_C_COMPILER_LAUNCHER: ccache

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ccache libasound2-dev libx11-dev libxrender-dev libxrandr-dev libxcursor-dev libxi-dev \
            libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev pkg-config

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Build
        run: |
          cmake --preset linux-debug
          cmake --build build-linux-debug -j$(nproc)

      - name: Test
        run: ctest --test-dir build-linux-debug --output-on-failure

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: License check
        run: python tools/license_check.py

      - name: Heatmap is current
        run: python3 tools/progress_heatmap.py --check
