# Keep parallel rustc/linker memory bounded so long builds (gpui, rubberband-sys) cannot exhaust the WSL VM.
[build]
jobs = 4
# One target dir for the root workspace and the three spikes (each spike is its own Cargo workspace and
# would otherwise keep a private copy of every shared dependency). Resolved against the repo root.
target-dir = "target"

[profile.dev]
debug = "line-tables-only"

# Dependencies need no debug info of their own (most of a debug target dir) and run optimised: an
# unoptimised GPUI window ran at 12 fps against 60 in release (measured with OPENMIXER_FRAME_STATS=1).
[profile.dev.package."*"]
debug = false
opt-level = 2

# The view crates build every frame's quads: optimised too, with line tables kept for stepping.
[profile.dev.package.om-ui]
opt-level = 2

[profile.dev.package.om-ui-gpui]
opt-level = 2
