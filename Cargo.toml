[workspace]
resolver = "2"
members = [
    "crates/om-core",
    "crates/om-dsp",
    "crates/om-engine",
    "crates/om-analysis",
    "crates/om-library",
    "crates/om-midi",
    "crates/om-stretch",
    "crates/om-audio",
    "crates/om-ui",
    "crates/openmixer",
]
# GPUI window layer: its own workspace (system libraries and a display are needed to build it). The
# openmixer binary pulls it in behind the `gui` feature. See docs/spikes/DECISIONS.md, "GPUI integration".
exclude = ["crates/om-ui-gpui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/massive-development/openmixer"
rust-version = "1.91"

[workspace.lints.rust]
unsafe_code = "forbid"

# `cargo test` runs the engine in real time (the soak and the render-budget tests). Unoptimized DSP
# misses the 256-frame budget, so test builds optimize the audio crates and their dependencies, as
# the C++ soak runs in Release. `cargo build` stays unoptimized for debugging.
[profile.test.package."*"]
opt-level = 3

[profile.test.package.om-core]
opt-level = 3

[profile.test.package.om-dsp]
opt-level = 3

[profile.test.package.om-engine]
opt-level = 3

[profile.test.package.om-stretch]
opt-level = 3

[profile.test.package.om-audio]
opt-level = 3

[profile.test.package.om-analysis]
opt-level = 3
