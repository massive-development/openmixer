[workspace]
resolver = "2"
members = [
    "crates/om-core",
    "crates/om-dsp",
    "crates/om-engine",
    "crates/om-analysis",
    "crates/om-automix",
    "crates/om-library",
    "crates/om-midi",
    "crates/om-stretch",
    "crates/om-audio",
    "crates/om-ui",
    "crates/om-plugins",
    "crates/om-stems",
    "crates/om-ui-gpui",
    "crates/om-testing",
    "examples/plugins/gain-plugin",
    "examples/plugins/gain-plugin-cdylib",
    "crates/openmixer",
]
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/massive-development/openmixer"
rust-version = "1.91"

[workspace.dependencies]
dirs = "5"
om-analysis = { path = "crates/om-analysis" }
om-audio = { path = "crates/om-audio" }
om-core = { path = "crates/om-core" }
om-dsp = { path = "crates/om-dsp" }
om-engine = { path = "crates/om-engine" }
om-library = { path = "crates/om-library" }
om-midi = { path = "crates/om-midi" }
om-plugins = { path = "crates/om-plugins" }
om-stems = { path = "crates/om-stems" }
om-automix = { path = "crates/om-automix" }
om-stretch = { path = "crates/om-stretch" }
om-testing = { path = "crates/om-testing" }
om-ui = { path = "crates/om-ui" }
om-ui-gpui = { path = "crates/om-ui-gpui" }
rtrb = "0.4"
rusqlite = { version = "0.35", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

# Release is the shipping, real-time build. Thin LTO with one codegen unit lets the audio path inline across
# om-core, om-dsp and om-engine. Do not set `panic = "abort"`: deck workers, the job queue and the watch-folder
# scanner isolate panics with `catch_unwind`, and abort would turn a bad file into a dead audio thread.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = true

# `cargo test` runs the engine in real time (the soak and the render-budget tests). Unoptimized DSP
# misses the 256-frame budget, so test builds optimize the audio crates and their dependencies (the
# soak runs in Release). `cargo build` stays unoptimized for debugging.
[profile.test.package."*"]
opt-level = 3

[profile.test.package.om-core]
opt-level = 3

[profile.test.package.om-dsp]
opt-level = 3

[profile.test.package.om-engine]
opt-level = 3

[profile.test.package.om-stretch]
opt-level = 3

[profile.test.package.om-audio]
opt-level = 3

[profile.test.package.om-analysis]
opt-level = 3
